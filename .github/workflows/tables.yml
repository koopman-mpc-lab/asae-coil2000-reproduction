name: table-check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: deps
        run: pip install numpy pandas scikit-learn
      - name: recompute Table 3
        run: python scripts/check_table_consistency.py
